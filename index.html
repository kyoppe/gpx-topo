<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18202b" />
    <link rel="icon" type="image/png" href="/gpx-topo-logo.png" />
    <title>GPX箱庭なんちゃら</title>
    <script>
      // From the first moment, before the app is up, the right button moves the model rather than opening the
      // browser's menu; only fields being typed in keep their menu.
      window.addEventListener(
        'contextmenu',
        (event) => {
          const target = event.target;
          if (target instanceof Element && target.closest('input:not([type=range]):not([type=button]):not([type=submit]),textarea,[contenteditable]')) return;
          event.preventDefault();
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
