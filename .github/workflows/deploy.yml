name: Test and deploy

on:
  push:
    branches:
      - main

concurrency:
  group: gpx-topo-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  DD_SITE: datadoghq.com
  DD_SERVICE: gpx-topo-web
  DD_ENV: ci
  CF_PAGES_COMMIT_SHA: ${{ github.sha }}

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload test results to Datadog
        if: ${{ always() }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_GIT_COMMIT_SHA: ${{ github.sha }}
          DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ ! -s test-results/junit.xml ]; then
            echo "JUnit report was not generated; skipping Datadog test upload."
            exit 0
          fi
          npx --yes @datadog/datadog-ci@latest junit upload \
            --service "$DD_SERVICE" \
            --env "$DD_ENV" \
            --git-repository-url "$DD_GIT_REPOSITORY_URL" \
            test-results/junit.xml

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name gpx-topo \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --format=%s)"
